<!doctype html>
<html lang="en" data-skin="github" data-theme="auto">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tour prototype</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap"
    />
    <link rel="stylesheet" href="/static/styles.css" />
    <link rel="stylesheet" href="./tour.css" />
  </head>
  <body>
    <div class="page tour-page" id="app">
      <header class="hdr">
        <div class="hdr-bar">
          <div class="brand">
            <span class="brand-wordmark"
              ><img class="brand-icon" src="/static/brand.svg" width="32" height="32" alt="" />PR review
              canvas</span
            ><span class="mono muted">tour · prototype</span>
          </div>
          <div class="hdr-actions" role="group" aria-label="Tour actions">
            <button class="cmd" type="button" id="help" title="Keys and what a tour is">help</button>
            <button class="cmd" type="button" id="skin-toggle" title="Switch skin">github</button>
            <button class="cmd" type="button" id="theme-toggle" title="Switch theme">auto</button>
            <button class="cmd" type="button" id="reset" title="Prototype: forget picks, answers, and notes">
              reset
            </button>
          </div>
        </div>
        <div class="stripe" aria-hidden="true"></div>
        <nav class="tour-rail" id="rail" aria-label="Tour progress"></nav>
      </header>
      <main class="tour-main">
        <section class="tour-stage" id="stage" aria-live="polite"></section>
      </main>
      <footer class="tour-nav" id="nav"></footer>
      <dialog class="tour-chat" id="chat" aria-label="Grilling"></dialog>
      <dialog class="tour-help" id="help-dialog" aria-label="Help"></dialog>
    </div>
    <script type="module" src="./tour.js"></script>
  </body>
</html>
