services:
  - type: web
    name: pr-review-canvas
    runtime: docker
    plan: standard
    numInstances: 1
    healthCheckPath: /healthz
    disk:
      name: pr-review-data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: PR_REVIEW_PUBLIC_URL
        sync: false
      - key: GITHUB_ORGANIZATION
        value: CactusTechnologies
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_PRIVATE_KEY
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: PR_REVIEW_SESSION_KEY
        sync: false
      - key: CLAUDE_CODE_OAUTH_TOKEN
        sync: false
      - key: PR_REVIEW_DATA_DIR
        value: /var/data/pr-review
      - key: PR_REVIEW_AGENT_HOME
        value: /var/data/agent
